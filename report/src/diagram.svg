<svg viewBox="0 0 760 372" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Calibri, Arial, sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><text x="8" y="16" font-size="11" font-weight="700" fill="#c2410c" letter-spacing="1.2">A. INDEXING (done once per document)</text><rect x="8" y="28" width="136" height="64" rx="6" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="76.0" y="56.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">1. PDF pages</text><text x="76.0" y="70.0" text-anchor="middle" font-size="9" fill="#444">PyMuPDF</text><text x="76.0" y="81.0" text-anchor="middle" font-size="9" fill="#444">page numbers kept</text><rect x="160" y="28" width="136" height="64" rx="6" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="228.0" y="56.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">2. Clean</text><text x="228.0" y="70.0" text-anchor="middle" font-size="9" fill="#444">NFKC, de-hyphenate</text><text x="228.0" y="81.0" text-anchor="middle" font-size="9" fill="#444">whitespace</text><rect x="312" y="28" width="136" height="64" rx="6" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="380.0" y="56.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">3. Chunk</text><text x="380.0" y="70.0" text-anchor="middle" font-size="9" fill="#444">sentence-aware</text><text x="380.0" y="81.0" text-anchor="middle" font-size="9" fill="#444">500 chars, overlap</text><rect x="464" y="28" width="136" height="64" rx="6" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="532.0" y="56.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">4. Vectorise</text><text x="532.0" y="70.0" text-anchor="middle" font-size="9" fill="#444">TF-IDF / BM25</text><text x="532.0" y="81.0" text-anchor="middle" font-size="9" fill="#444">MiniLM (384-d)</text><rect x="616" y="28" width="136" height="64" rx="6" fill="#fbf3ee" stroke="#222" stroke-width="1.3"/><text x="684.0" y="56.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">5. Vector store</text><text x="684.0" y="70.0" text-anchor="middle" font-size="9" fill="#444">NumPy matrix</text><text x="684.0" y="81.0" text-anchor="middle" font-size="9" fill="#444">FAISS IndexFlatIP</text><line x1="144" y1="60" x2="160" y2="60" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><line x1="296" y1="60" x2="312" y2="60" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><line x1="448" y1="60" x2="464" y2="60" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><line x1="600" y1="60" x2="616" y2="60" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="8" y="132" font-size="11" font-weight="700" fill="#c2410c" letter-spacing="1.2">B. QUESTION ANSWERING (every query)</text><rect x="8" y="146" width="136" height="64" rx="6" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="76.0" y="174.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">6. Question</text><text x="76.0" y="188.0" text-anchor="middle" font-size="9" fill="#444">user text</text><rect x="160" y="146" width="136" height="64" rx="6" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="228.0" y="174.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">7. Embed query</text><text x="228.0" y="188.0" text-anchor="middle" font-size="9" fill="#444">same MiniLM model</text><rect x="312" y="146" width="136" height="64" rx="6" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="380.0" y="174.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">8. Retrieve</text><text x="380.0" y="188.0" text-anchor="middle" font-size="9" fill="#444">cosine similarity</text><text x="380.0" y="199.0" text-anchor="middle" font-size="9" fill="#444">top-3 chunks</text><rect x="464" y="146" width="136" height="64" rx="6" fill="#fff3cd" stroke="#222" stroke-width="1.3"/><text x="532.0" y="174.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">9. Refusal gate</text><text x="532.0" y="188.0" text-anchor="middle" font-size="9" fill="#444">best score &gt;= 0.xx ?</text><text x="532.0" y="199.0" text-anchor="middle" font-size="9" fill="#444">(threshold)</text><line x1="144" y1="178" x2="160" y2="178" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><line x1="296" y1="178" x2="312" y2="178" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><line x1="448" y1="178" x2="464" y2="178" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><rect x="616" y="146" width="136" height="64" rx="6" fill="#fbf3ee" stroke="#222" stroke-width="1.3"/><text x="684.0" y="174.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">10. Generate</text><text x="684.0" y="188.0" text-anchor="middle" font-size="9" fill="#444">FLAN-T5-base</text><text x="684.0" y="199.0" text-anchor="middle" font-size="9" fill="#444">context-only prompt</text><line x1="600" y1="178" x2="616" y2="178" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="534" y="228" text-anchor="middle" font-size="9" fill="#a33">no: below threshold</text><line x1="532" y1="210" x2="532" y2="250" stroke="#a33" stroke-width="1.6" marker-end="url(#a)"/><rect x="464" y="252" width="136" height="52" rx="6" fill="#fdeaea" stroke="#a33" stroke-width="1.3"/><text x="532.0" y="274.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">Refuse</text><text x="532.0" y="288.0" text-anchor="middle" font-size="9" fill="#444">"I could not find this</text><text x="532.0" y="299.0" text-anchor="middle" font-size="9" fill="#444">in the documents"</text><text x="608" y="140" font-size="9" fill="#2a7a3b" text-anchor="start"></text><line x1="684" y1="210" x2="684" y2="252" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><rect x="616" y="252" width="136" height="52" rx="6" fill="#eaf6ec" stroke="#2a7a3b" stroke-width="1.3"/><text x="684.0" y="274.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">Answer + citation</text><text x="684.0" y="288.0" text-anchor="middle" font-size="9" fill="#444">page read from metadata</text><text x="650" y="236" font-size="9" fill="#2a7a3b">yes</text><rect x="8" y="252" width="400" height="52" rx="6" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/><text x="208.0" y="274.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">11. Evaluation (offline)</text><text x="208.0" y="288.0" text-anchor="middle" font-size="9" fill="#444">Recall@1/3/5 and MRR on 30 questions </text><text x="208.0" y="299.0" text-anchor="middle" font-size="9" fill="#444"> answer / citation / faithfulness / refusal checks</text><text x="8" y="330" font-size="9.5" fill="#555">Vector store built in A is searched in step 8. Shaded boxes: stored index (5), decision (9), refusal and final answer.</text></svg>