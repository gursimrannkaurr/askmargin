<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><text x="8" y="16" font-size="12" font-weight="700" fill="#111">Preparation and comparison</text><rect x="8" y="26" width="136" height="56" rx="5" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="76.0" y="51.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">1. Read and clean</text><text x="76.0" y="65.0" text-anchor="middle" font-size="9" fill="#444">PDF pages, page</text><text x="76.0" y="76.0" text-anchor="middle" font-size="9" fill="#444">numbers kept</text><rect x="160" y="26" width="136" height="56" rx="5" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="228.0" y="51.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">2. Chunks</text><text x="228.0" y="65.0" text-anchor="middle" font-size="9" fill="#444">about 500 characters,</text><text x="228.0" y="76.0" text-anchor="middle" font-size="9" fill="#444">whole sentences</text><rect x="312" y="26" width="136" height="56" rx="5" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="380.0" y="51.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">3. TF-IDF search</text><text x="380.0" y="65.0" text-anchor="middle" font-size="9" fill="#444">word matching</text><rect x="464" y="26" width="136" height="56" rx="5" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="532.0" y="51.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">4. Embedding search</text><text x="532.0" y="65.0" text-anchor="middle" font-size="9" fill="#444">meaning matching,</text><text x="532.0" y="76.0" text-anchor="middle" font-size="9" fill="#444">cosine similarity</text><rect x="616" y="26" width="136" height="56" rx="5" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="684.0" y="51.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">5. Compare</text><text x="684.0" y="65.0" text-anchor="middle" font-size="9" fill="#444">10 test questions,</text><text x="684.0" y="76.0" text-anchor="middle" font-size="9" fill="#444">top-3 accuracy</text><line x1="144" y1="54" x2="160" y2="54" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><line x1="296" y1="54" x2="312" y2="54" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><line x1="448" y1="54" x2="464" y2="54" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><line x1="600" y1="54" x2="616" y2="54" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><text x="8" y="118" font-size="12" font-weight="700" fill="#111">Answering a question</text><rect x="8" y="128" width="136" height="56" rx="5" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="76.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">Question</text><text x="76.0" y="167.0" text-anchor="middle" font-size="9" fill="#444">typed by the user</text><rect x="160" y="128" width="136" height="56" rx="5" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="228.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">Embedding search</text><text x="228.0" y="167.0" text-anchor="middle" font-size="9" fill="#444">top 3 chunks</text><rect x="312" y="128" width="136" height="56" rx="5" fill="#e6e6e6" stroke="#222" stroke-width="1.3"/><text x="380.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">7. Score above 0.25 ?</text><text x="380.0" y="167.0" text-anchor="middle" font-size="9" fill="#444">refusal check</text><line x1="144" y1="156" x2="160" y2="156" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><line x1="296" y1="156" x2="312" y2="156" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><rect x="464" y="128" width="136" height="56" rx="5" fill="#fff" stroke="#222" stroke-width="1.3"/><text x="532.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">6. FLAN-T5</text><text x="532.0" y="167.0" text-anchor="middle" font-size="9" fill="#444">writes the answer</text><rect x="616" y="128" width="136" height="56" rx="5" fill="#e6e6e6" stroke="#222" stroke-width="1.3"/><text x="684.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">Answer + pages</text><text x="684.0" y="167.0" text-anchor="middle" font-size="9" fill="#444">sources from metadata</text><line x1="448" y1="156" x2="464" y2="156" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><line x1="600" y1="156" x2="616" y2="156" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><text x="452" y="148" font-size="9" fill="#111" text-anchor="end">yes</text><line x1="380" y1="184" x2="380" y2="206" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/><rect x="312" y="206" width="136" height="36" rx="5" fill="#e6e6e6" stroke="#222" stroke-width="1.3"/><text x="380.0" y="221.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111">Refuse</text><text x="380.0" y="235.0" text-anchor="middle" font-size="9" fill="#444">"I could not find this"</text><text x="388" y="199" font-size="9" fill="#111">no</text></svg>